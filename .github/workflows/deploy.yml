name: CI/CD Pipeline - FastAPI AWS Cloud Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Job 1: Continuous Integration (Lint & Test)
  # ==========================================
  ci-test:
    name: Run Tests & Docker Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest -v tests/

      - name: Test Local Docker Build (Task 4.3)
        run: |
          docker build -t fastapi-app:test .

  # ==========================================
  # Job 2: Continuous Deployment to Amazon EC2
  # ==========================================
  cd-deploy:
    name: Build, Push Image & Deploy to Amazon EC2
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-aws-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-aws-app:${{ github.sha }}

      - name: Deploy to Amazon EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "=== Starting Deployment on EC2 ==="
            
            # Pull latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-aws-app:latest
            
            # Stop and remove existing container if running
            docker stop fastapi_cloud_app || true
            docker rm fastapi_cloud_app || true
            
            # Run updated container with AWS RDS & S3 environment variables
            docker run -d \
              --name fastapi_cloud_app \
              --restart always \
              -p 80:8000 \
              -e APP_NAME="FastAPI AWS Cloud Application" \
              -e APP_ENV=production \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-aws-app:latest
            
            # Prune old dangling images
            docker image prune -f
            
            echo "=== Verifying Deployment Health ==="
            sleep 5
            curl -f http://localhost:80/health || (echo "Health check failed!" && exit 1)
            echo "=== Deployment Successful! ==="
