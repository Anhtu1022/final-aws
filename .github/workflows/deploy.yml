name: CI/CD Pipeline - Build on EC2 & Restart Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Job 1: Continuous Integration (Test & Lint)
  # ==========================================
  ci-test:
    name: Run Pytest Tests & Local Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest -v tests/

      - name: Verify Docker Build Locally (Task 4.3)
        run: |
          docker build -t fastapi-prod-app:test .

  # ==========================================
  # Job 2: Continuous Deployment to Amazon EC2
  # Directly pulls, rebuilds image on EC2, and restarts container
  # (No Container Registry required as per Exam Note)
  # ==========================================
  cd-deploy:
    name: SSH into EC2, Rebuild on Instance & Restart
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Amazon EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Step 1: Navigating to project directory on EC2 ==="
            APP_DIR="$HOME/fastapi-aws"
            
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository for the first time..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            echo "=== Step 2: Pulling latest code from main branch ==="
            git fetch origin main
            git reset --hard origin/main
            
            echo "=== Step 3: Rebuilding Docker image directly on EC2 instance ==="
            docker build -t fastapi-prod-app:latest .
            
            echo "=== Step 4: Stopping and removing previous containers ==="
            docker stop fastapi_cloud_app fastapi-app || true
            docker rm fastapi_cloud_app fastapi-app || true
            
            echo "=== Step 5: Running new container with AWS Secrets ==="
            docker run -d \
              --name fastapi_cloud_app \
              --restart always \
              -p 8000:8000 \
              -e APP_NAME="FastAPI AWS Cloud Application" \
              -e APP_ENV=production \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AWS_REGION="ap-southeast-1" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" \
              fastapi-prod-app:latest
            
            echo "=== Step 6: Cleaning up old dangling images ==="
            docker image prune -f || true
            
            echo "=== Step 7: Verifying application health ==="
            sleep 5
            curl -f http://localhost:8000/health || (echo "Deployment health check failed!" && exit 1)
            echo "=== Deployment Successful on EC2! ==="
